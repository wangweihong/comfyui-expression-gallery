<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Expression Gallery · 表情图库</title><link rel="icon" href="web/icon.svg"><link rel="stylesheet" href="web/style.css?v=0.4.0"><link rel="stylesheet" href="web/tag_styles.css?v=0.4.0"><link rel="stylesheet" href="web/asset_styles.css?v=0.4.0"><script type="module" src="web/gallery.mjs?v=0.4.1"></script></head>
<body>
<header class="topbar"><a href="gallery" class="brand"><img src="web/icon.svg" width="30" height="30" alt=""><strong data-t="brand"></strong><span data-t="badge"></span></a><nav><button id="custom-upload-open" data-t="upload"></button><button id="manage-assets" data-t="manageAssets"></button><button id="manage-tags" data-t="manage"></button><button id="guide-toggle" aria-label="使用说明 / Guide">?</button><button id="language" aria-label="语言 / Language">English</button></nav></header>
<main><section class="intro"><div><p class="eyebrow">FACIAL EXPRESSION ARCHIVE / QWEN 2.1</p><h1 data-t="title"></h1><p data-t="intro"></p></div><div class="collection-note"><strong id="total"></strong><span id="batch-state"></span></div></section>
<section class="library" aria-label="Expression library"><div id="categories" class="categories"></div><div id="type-options" class="type-options"></div><div class="toolbar"><input id="q" type="search" autocomplete="off"><select id="origin" aria-label="素材来源 / Asset source"></select><select id="actor" aria-label="人物 / Actor"></select><select id="review-state" aria-label="标注状态 / Annotation state"></select><button id="reset" data-t="reset"></button></div><div class="tag-filterbar"><button id="tag-filter" data-t="filters"></button><button id="clear-tag-filters" data-t="clearFilters" hidden></button><div id="filter-tags" class="tag-summary"></div><button id="batch-toggle" data-t="batch"></button></div><p class="taxonomy-note" data-t="annotationHint"></p><div id="batch-toolbar" class="batch-toolbar" hidden><strong id="selected-count"></strong><button id="select-page" data-t="selectPage"></button><button id="select-filtered" data-t="selectFiltered"></button><button id="clear-selection" data-t="clearSelection"></button><button id="batch-edit" data-t="batchEdit"></button><button id="batch-delete" class="danger" data-t="deleteSelected"></button></div><div class="result-line"><h2 id="section-title"></h2><p id="status" role="status" aria-live="polite"></p></div><div id="grid" class="grid"></div><p id="empty" hidden data-t="empty"></p><p id="load-error" role="alert" hidden></p><button id="retry" hidden data-t="retry"></button><button id="more" class="more" data-t="more" hidden></button></section></main>
<footer><p data-t="source"></p><p data-t="note"></p></footer>
<dialog id="viewer" aria-labelledby="detail-title"><div class="detail"><div class="picture"><img id="large" alt=""><p id="image-status" role="status"></p></div><div class="detail-info"><button id="close" class="close" data-t="close"></button><p class="eyebrow" id="detail-code"></p><h2 id="detail-title"></h2><p id="detail-label"></p><p id="detail-meta"></p><p id="position"></p><div id="detail-tags" class="detail-tags"></div><div class="actions"><button id="rename-custom" data-t="renameCustom" hidden></button><button id="edit-tags" data-t="editTags"></button><button id="delete-image" class="danger" data-t="deleteImage"></button><button id="use" class="primary" data-t="use"></button><a id="download" class="primary" download data-t="download"></a><a id="open" target="_blank" rel="noopener" data-t="open"></a><button id="copy" data-t="copy"></button></div><div class="paging"><button id="prev" data-t="prev"></button><button id="next" data-t="next"></button></div><small data-t="keys"></small></div></div></dialog>
<dialog id="guide"><h2 data-t="badge"></h2><p data-t="help"></p><form method="dialog"><button data-t="close"></button></form></dialog>
<noscript>请启用 JavaScript 浏览图库。 Enable JavaScript to browse the gallery.</noscript>
</body></html>
